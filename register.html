<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bargain Bid – Register</title>
    <link rel="icon" href="/img/favicon.ico" />
    <link href="/css/style.css" rel="stylesheet" />
  </head>
  <body class="bg-base-100 text-neutral">
    <main class="mx-auto max-w-md px-4 py-10">
      <h1 class="mb-6 text-2xl font-bold">Create account</h1>

      <form id="registerForm" class="space-y-4 rounded-xl border bg-white p-6">
        <div>
          <label class="mb-1 block text-sm font-medium" for="name">Name</label>
          <input class="w-full rounded border px-3 py-2" id="name" name="name" required />
        </div>

        <div>
          <label class="mb-1 block text-sm font-medium" for="email">Student Email</label>
          <input
            class="w-full rounded border px-3 py-2"
            id="email"
            name="email"
            type="email"
            placeholder="first.last@stud.noroff.no"
            required
          />
          <p class="mt-1 text-xs text-neutral/70">Must end with <code>@stud.noroff.no</code></p>
        </div>

        <div>
          <label class="mb-1 block text-sm font-medium" for="password">Password</label>
          <input
            class="w-full rounded border px-3 py-2"
            id="password"
            name="password"
            type="password"
            minlength="8"
            required
          />
        </div>

        <details class="rounded border bg-base-100 p-3">
          <summary class="cursor-pointer select-none">Optional profile details</summary>
          <div class="mt-3 grid grid-cols-1 gap-3">
            <div>
              <label class="mb-1 block text-sm font-medium" for="bio">Bio</label>
              <textarea
                class="w-full rounded border px-3 py-2"
                id="bio"
                name="bio"
                rows="2"
              ></textarea>
            </div>
            <div>
              <label class="mb-1 block text-sm font-medium" for="avatarUrl">Avatar URL</label>
              <input
                class="w-full rounded border px-3 py-2"
                id="avatarUrl"
                name="avatarUrl"
                type="url"
                placeholder="https://..."
              />
            </div>
            <div>
              <label class="mb-1 block text-sm font-medium" for="avatarAlt">Avatar Alt</label>
              <input
                class="w-full rounded border px-3 py-2"
                id="avatarAlt"
                name="avatarAlt"
                type="text"
              />
            </div>
            <div>
              <label class="mb-1 block text-sm font-medium" for="bannerUrl">Banner URL</label>
              <input
                class="w-full rounded border px-3 py-2"
                id="bannerUrl"
                name="bannerUrl"
                type="url"
                placeholder="https://..."
              />
            </div>
            <div>
              <label class="mb-1 block text-sm font-medium" for="bannerAlt">Banner Alt</label>
              <input
                class="w-full rounded border px-3 py-2"
                id="bannerAlt"
                name="bannerAlt"
                type="text"
              />
            </div>
          </div>
        </details>

        <button
          id="registerBtn"
          class="w-full rounded bg-primary px-4 py-2 font-semibold text-white hover:bg-primary/90"
        >
          Create account
        </button>

        <p id="registerError" class="mt-2 hidden text-sm text-error"></p>
        <p class="mt-2 text-sm">
          Already have an account? <a class="text-secondary underline" href="/login.html">Login</a>
        </p>
      </form>
    </main>

    <script type="module" src="/js/app.js"></script>
    <script type="module" src="/js/pages/auth-register.js"></script>
  </body>
</html>
