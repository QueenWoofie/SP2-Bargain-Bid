<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bargain Bid – Login</title>
    <link rel="icon" href="/img/favicon.ico" />
    <link href="/css/style.css" rel="stylesheet" />
  </head>
  <body class="bg-base-100 text-neutral">
    <main class="mx-auto max-w-md px-4 py-10">
      <h1 class="mb-6 text-2xl font-bold">Login</h1>

      <form id="loginForm" class="space-y-4 rounded-xl border bg-white p-6">
        <div>
          <label class="mb-1 block text-sm font-medium" for="email">Email</label>
          <input
            class="w-full rounded border px-3 py-2"
            id="email"
            name="email"
            type="email"
            placeholder="first.last@stud.noroff.no"
            required
          />
        </div>

        <div>
          <label class="mb-1 block text-sm font-medium" for="password">Password</label>
          <input
            class="w-full rounded border px-3 py-2"
            id="password"
            name="password"
            type="password"
            required
          />
        </div>

        <button
          id="loginBtn"
          class="w-full rounded bg-primary px-4 py-2 font-semibold text-white hover:bg-primary/90"
        >
          Sign in
        </button>

        <p id="loginError" class="mt-2 hidden text-sm text-error"></p>
        <p class="mt-2 text-sm">
          No account? <a class="text-secondary underline" href="/register.html">Register here</a>
        </p>
      </form>
    </main>

    <script type="module" src="/js/app.js"></script>
    <script type="module" src="/js/pages/auth-login.js"></script>
  </body>
</html>
