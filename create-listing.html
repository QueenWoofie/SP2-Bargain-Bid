<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bargain Bid – Create Listing</title>
    <link rel="icon" href="/img/favicon.ico" />
    <link href="/css/style.css" rel="stylesheet" />
  </head>
  <body class="bg-base-100 text-neutral">
    <main class="mx-auto max-w-2xl px-4 py-8">
      <h1 class="mb-4 text-2xl font-bold">Create listing</h1>

      <form id="createForm" class="space-y-4 rounded-xl border bg-white p-6">
        <div>
          <label class="mb-1 block text-sm font-medium" for="title">Title</label>
          <input id="title" name="title" class="w-full rounded border px-3 py-2" required />
        </div>

        <div>
          <label class="mb-1 block text-sm font-medium" for="description">Description</label>
          <textarea
            id="description"
            name="description"
            class="w-full rounded border px-3 py-2"
            rows="4"
          ></textarea>
        </div>

        <div class="grid gap-4 md:grid-cols-2">
          <div>
            <label class="mb-1 block text-sm font-medium" for="endsAt">Ends at</label>
            <input
              id="endsAt"
              name="endsAt"
              type="datetime-local"
              class="w-full rounded border px-3 py-2"
              required
            />
            <p class="mt-1 text-xs text-neutral/70">Must be in the future</p>
          </div>
          <div>
            <label class="mb-1 block text-sm font-medium" for="tags">Tags (comma-separated)</label>
            <input
              id="tags"
              name="tags"
              class="w-full rounded border px-3 py-2"
              placeholder="tech, vintage"
            />
          </div>
        </div>

        <div>
          <label class="mb-1 block text-sm font-medium" for="media"
            >Image URLs (comma-separated)</label
          >
          <input
            id="media"
            name="media"
            class="w-full rounded border px-3 py-2"
            placeholder="https://..., https://..."
          />
          <p class="mt-1 text-xs text-neutral/70">Use public, valid image URLs</p>
        </div>

        <div class="flex items-center gap-3">
          <button
            id="createBtn"
            class="rounded bg-primary px-4 py-2 font-semibold text-white hover:bg-primary/90"
          >
            Create
          </button>
          <a href="/listings.html" class="rounded border bg-white px-4 py-2">Cancel</a>
        </div>

        <p id="createError" class="hidden text-error"></p>
      </form>
    </main>

    <script type="module" src="/js/app.js"></script>
    <script type="module" src="/js/pages/listing-create.js"></script>
  </body>
</html>
